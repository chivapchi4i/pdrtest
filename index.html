    <script>
      // Early theme detection to prevent flash of wrong theme (device theme by default)
      (function() {
        try {
          var saved = localStorage.getItem('rulemo_theme');
          var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && systemDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#0b111e';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.backgroundColor = '#f1f5f9';
          }
        } catch (e) {}
      })();
    </script>
