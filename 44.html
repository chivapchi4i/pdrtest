<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перегляд питань (Усі питання)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .file-upload-block {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-left: 5px solid transparent;
            transition: border-color 0.3s, background-color 0.3s;
        }
        .card.highlighted {
            border-left-color: #ff9800;
            background-color: #fff8e1;
        }
        .id-badge {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .section-title {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .image-name {
            font-size: 0.85em;
            color: #555;
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            font-family: monospace;
        }
        .image-container {
            min-height: 150px; /* Зменшує "стрибки" сторінки при завантаженні картинок */
            margin-bottom: 20px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            display: block;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .options li.correct {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            font-weight: bold;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #scrollTopBtn {
            display: none;
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #333;
            color: white;
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        #scrollTopBtn:hover {
            background-color: #555;
        }
    </style>
</head>
<body>

    <div class="controls" id="topControls">
        <div class="file-upload-block">
            <label for="fileInput"><b>Завантажте свій JSON-файл:</b></label>
            <input type="file" id="fileInput" accept=".json">
        </div>
        <div>
            <input type="text" id="searchId" placeholder="Введіть ID (напр. 1.1)">
            <button onclick="searchById()">Знайти за ID</button>
        </div>
    </div>

    <div id="questionsContainer"></div>

    <button id="scrollTopBtn" onclick="scrollToTop()" title="Повернутися вгору">↑</button>

    <script>
        let questions = [];

        // Обробка завантаження файлу користувачем
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (!Array.isArray(data)) {
                        alert("Помилка: JSON файл має містити масив питань.");
                        return;
                    }
                    questions = data;
                    renderAllQuestions();
                } catch (error) {
                    alert("Помилка при читанні JSON файлу.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
        });

        // Відображення усіх питань
        function renderAllQuestions() {
            const container = document.getElementById('questionsContainer');
            let htmlContent = '';

            questions.forEach(q => {
                const questionId = q.id !== undefined && q.id !== null ? q.id : 'Не вказано';

                let cardHTML = `
                    <div class="card" id="card-${questionId}">
                        <div class="id-badge">ID: ${questionId}</div>
                        <div class="section-title">${q.section || ''}</div>
                        <div class="question-text">${q.question}</div>
                `;

                if (q.image && q.image.trim() !== "") {
                    let imgPath = q.image.startsWith('/') ? q.image.substring(1) : q.image;
                    cardHTML += `
                        <div class="image-name">Зображення: ${q.image}</div>
                        <div class="image-container">
                            <img src="${imgPath}" alt="Зображення до питання" loading="lazy">
                        </div>
                    `;
                }

                cardHTML += `<ul class="options">`;
                if (q.options && Array.isArray(q.options)) {
                    q.options.forEach((opt, idx) => {
                        let isCorrectClass = (idx === q.correctOptionIndex) ? 'class="correct"' : '';
                        let correctLabel = (idx === q.correctOptionIndex) ? ' <span>(✓ Правильна відповідь)</span>' : '';
                        cardHTML += `<li ${isCorrectClass}>${opt}${correctLabel}</li>`;
                    });
                }
                cardHTML += `</ul></div>`;

                htmlContent += cardHTML;
            });

            container.innerHTML = htmlContent;
        }

        // Пошук за ID із "розумним скролом"
        function searchById() {
            if (questions.length === 0) {
                alert("Спочатку завантажте JSON-файл!");
                return;
            }
            
            const searchVal = document.getElementById('searchId').value.trim();
            if (!searchVal) return;

            document.querySelectorAll('.card.highlighted').forEach(el => {
                el.classList.remove('highlighted');
            });

            const targetEl = document.getElementById(`card-${searchVal}`);
            
            if (targetEl) {
                targetEl.classList.add('highlighted');
                
                // Розумний скрол: жорстко фіксуємо фокус на елементі
                // Робимо 12 спроб кожні 150 мілісекунд (загалом майже 2 секунди)
                let attempts = 0;
                targetEl.scrollIntoView({ behavior: 'auto', block: 'center' }); // Перший швидкий стрибок

                const scrollInterval = setInterval(() => {
                    targetEl.scrollIntoView({ behavior: 'auto', block: 'center' });
                    attempts++;
                    if (attempts >= 12) {
                        clearInterval(scrollInterval);
                    }
                }, 150);

            } else {
                alert(`Питання з ID "${searchVal}" не знайдено.`);
            }
        }

        // Логіка кнопки "Вгору"
        window.onscroll = function() {
            const btn = document.getElementById("scrollTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "block";
            } else {
                btn.style.display = "none";
            }
        };

        function scrollToTop() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('searchId').value = '';
            document.getElementById('searchId').focus();
        }
    </script>
</body>
</html>
