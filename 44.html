<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перегляд питань (по 3 на сторінці)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            position: sticky;
            top: 10px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            border-left: 5px solid transparent;
            transition: border-color 0.3s;
        }
        .card.highlighted {
            border-left-color: #007bff; /* Виділення знайденого питання */
        }
        .section-title {
            color: #777;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .question-text {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .image-name {
            font-size: 0.85em;
            color: #555;
            background: #eee;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            font-family: monospace;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 4px;
            margin-bottom: 20px;
        }
        .options {
            list-style-type: none;
            padding: 0;
        }
        .options li {
            padding: 12px 15px;
            margin-bottom: 8px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .options li.correct {
            background: #d4edda;
            border-color: #c3e6cb;
            color: #155724;
            font-weight: bold;
        }
        .nav-buttons {
            display: flex;
            justify-content: space-between;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 10px;
            margin-bottom: 50px;
        }
        button {
            padding: 8px 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        input[type="text"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        #questionsContainer {
            display: none; /* Приховано до завантаження файлу */
        }
    </style>
</head>
<body>

    <div class="controls">
        <div>
            <label for="fileInput"><b>Завантажте JSON-файл:</b></label><br>
            <input type="file" id="fileInput" accept=".json">
        </div>
        <div>
            <input type="text" id="searchId" placeholder="Введіть ID (напр. 1.1)">
            <button onclick="searchById()">Знайти за ID</button>
        </div>
    </div>

    <div id="questionsContainer"></div>

    <div class="nav-buttons" id="navContainer" style="display: none;">
        <button id="prevBtn" onclick="prevPage()">⬅ Попередня сторінка</button>
        <span id="counter" style="align-self: center; font-weight: bold;"></span>
        <button id="nextBtn" onclick="nextPage()">Наступна сторінка ➡</button>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0; // Вказує на індекс першого питання на поточній сторінці
        const questionsPerPage = 3; // Кількість питань на сторінці

        // Обробка завантаження файлу
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    questions = JSON.parse(event.target.result);
                    if (!Array.isArray(questions)) {
                        alert("Помилка: JSON файл має містити масив питань.");
                        return;
                    }
                    document.getElementById('questionsContainer').style.display = 'block';
                    document.getElementById('navContainer').style.display = 'flex';
                    showPage(0);
                } catch (error) {
                    alert("Помилка при читанні JSON файлу. Перевірте формат.");
                    console.error(error);
                }
            };
            reader.readAsText(file);
        });

        // Відображення блоку з 3 питань
        function showPage(startIndex, highlightId = null) {
            if (startIndex < 0 || questions.length === 0) return;
            currentIndex = startIndex;
            
            const container = document.getElementById('questionsContainer');
            container.innerHTML = ''; // Очищаємо попередні питання

            // Цикл для генерації до 3 питань
            for (let i = currentIndex; i < currentIndex + questionsPerPage && i < questions.length; i++) {
                const q = questions[i];
                let isHighlighted = highlightId === String(q.id) ? 'highlighted' : '';
                
                let cardHTML = `
                    <div class="card ${isHighlighted}" id="card-${q.id}">
                        <div class="section-title">${q.section || ''}</div>
                        <div class="question-text">
                            <span style="color: #007bff; margin-right: 10px;">[ID: ${q.id}]</span>
                            <span>${q.question}</span>
                        </div>
                `;

                // Якщо є зображення, додаємо назву та саму картинку
                if (q.image && q.image.trim() !== "") {
                    let imgPath = q.image.startsWith('/') ? q.image.substring(1) : q.image;
                    cardHTML += `
                        <div class="image-name">Зображення: ${q.image}</div>
                        <div class="image-container">
                            <img src="${imgPath}" alt="Зображення до питання">
                        </div>
                    `;
                }

                // Генеруємо список відповідей
                cardHTML += `<ul class="options">`;
                q.options.forEach((opt, idx) => {
                    let isCorrectClass = (idx === q.correctOptionIndex) ? 'class="correct"' : '';
                    let correctLabel = (idx === q.correctOptionIndex) ? ' <span>(✓ Правильна відповідь)</span>' : '';
                    cardHTML += `<li ${isCorrectClass}>${opt}${correctLabel}</li>`;
                });
                cardHTML += `</ul></div>`;

                container.innerHTML += cardHTML;
            }

            // Оновлення лічильника
            const endIdx = Math.min(currentIndex + questionsPerPage, questions.length);
            document.getElementById('counter').innerText = `Питання ${currentIndex + 1} - ${endIdx} з ${questions.length}`;

            // Оновлення кнопок
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex + questionsPerPage >= questions.length);

            // Якщо був пошук, прокручуємо екран до знайденого питання
            if (highlightId) {
                setTimeout(() => {
                    const el = document.getElementById(`card-${highlightId}`);
                    if (el) {
                        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
            } else {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        // Навігація по сторінках
        function prevPage() {
            if (currentIndex - questionsPerPage >= 0) {
                showPage(currentIndex - questionsPerPage);
            } else {
                showPage(0); // Якщо залишається менше 3 питань до початку
            }
        }

        function nextPage() {
            if (currentIndex + questionsPerPage < questions.length) {
                showPage(currentIndex + questionsPerPage);
            }
        }

        // Пошук за ID
        function searchById() {
            if (questions.length === 0) {
                alert("Спочатку завантажте JSON-файл!");
                return;
            }
            const searchVal = document.getElementById('searchId').value.trim();
            const foundIndex = questions.findIndex(q => String(q.id) === searchVal);
            
            if (foundIndex !== -1) {
                // Визначаємо, на якій "сторінці" знаходиться знайдене питання
                const pageStartIndex = Math.floor(foundIndex / questionsPerPage) * questionsPerPage;
                showPage(pageStartIndex, searchVal);
            } else {
                alert(`Питання з ID "${searchVal}" не знайдено.`);
            }
        }
    </script>
</body>
</html>
